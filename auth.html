<!-- ==========================================
     START OF RAFI'S CODE (Authentication / Sign-In Page)
     ========================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resilio – Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ===========================
       AUTH PAGE SPECIFIC STYLES
       =========================== */
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      padding: 2rem;
    }

    .auth-bg-grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(90deg, rgba(255,59,48,0.03) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,59,48,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      animation: drift 20s linear infinite;
    }

    @keyframes drift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    .auth-box {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3rem 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      backdrop-filter: blur(20px);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .auth-logo {
      font-family: var(--font-display);
      font-size: 2.2rem;
      letter-spacing: 0.1em;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .auth-logo-pulse {
      width: 10px; height: 10px;
      background: var(--available);
      border-radius: 50%;
      animation: pulse-glow 1.5s ease-in-out infinite;
    }

    .auth-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      letter-spacing: 0.05em;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
    }

    .auth-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .auth-tab {
      flex: 1;
      padding: 0.75rem;
      background: none;
      border: none;
      color: var(--text-dim);
      font-family: var(--font-ui);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }

    .auth-tab.active {
      color: var(--accent);
    }

    .auth-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1rem;
      left: 0; right: 0;
      height: 2px;
      background: var(--accent);
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .form-input {
      width: 100%;
      padding: 0.875rem 1rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 0.95rem;
      transition: all 0.3s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(255,59,48,0.2);
      background: rgba(255,59,48,0.05);
    }

    .form-input::placeholder {
      color: var(--text-dim);
    }

    .form-checkbox {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    .form-checkbox input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .form-checkbox a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s;
    }

    .form-checkbox a:hover {
      border-bottom-color: var(--accent);
    }

    .form-actions {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .auth-btn {
      flex: 1;
      padding: 0.875rem 1rem;
      border: none;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
      text-transform: uppercase;
    }

    .auth-btn-primary {
      background: var(--accent);
      color: #fff;
      flex: 1;
    }

    .auth-btn-primary:hover {
      background: #FF2D1F;
      box-shadow: 0 8px 24px rgba(255,59,48,0.3);
    }

    .auth-btn-primary:active {
      transform: scale(0.98);
    }

    .auth-btn-secondary {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .auth-btn-secondary:hover {
      background: rgba(255,255,255,0.05);
      border-color: var(--accent);
    }

    .form-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .form-divider::before,
    .form-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .oauth-buttons {
      display: flex;
      gap: 1rem;
    }

    .oauth-btn {
      flex: 1;
      padding: 0.75rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .oauth-btn:hover {
      border-color: var(--accent);
      background: rgba(255,59,48,0.05);
    }

    .auth-footer {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s;
    }

    .auth-footer a:hover {
      border-bottom-color: var(--accent);
    }

    .back-home {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.3s;
      z-index: 20;
    }

    .back-home:hover {
      background: var(--surface);
      border-color: var(--accent);
      color: var(--accent);
    }

    .status-badge {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(50,215,75,0.1);
      border: 1px solid rgba(50,215,75,0.3);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--available);
      letter-spacing: 0.05em;
      z-index: 20;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--available);
      border-radius: 50%;
      animation: pulse-glow 1.2s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-home">← BACK TO RESILIO</a>
  
  <div class="status-badge">
    <span class="status-dot"></span>
    MESH READY
  </div>

  <div class="auth-container">
    <div class="auth-bg-grid"></div>
    
    <div class="auth-box">
      <div class="auth-header">
        <div class="auth-logo">
          <span class="auth-logo-pulse"></span>
          RESILIO
        </div>
        <div class="auth-title">ACCESS MESH</div>
        <p class="auth-subtitle">Join the peer-to-peer disaster response network</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('signin')">SIGN IN</button>
        <button class="auth-tab" onclick="switchTab('signup')">SIGN UP</button>
      </div>

      <!-- SIGN IN FORM -->
      <form class="auth-form active" id="signinForm" onsubmit="handleSignIn(event)">
        <div class="form-group">
          <label class="form-label">Email or Node ID</label>
          <input type="text" class="form-input" placeholder="user@resilio.mesh" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" placeholder="••••••••" required>
        </div>

        <div class="form-checkbox">
          <input type="checkbox" id="rememberMe">
          <label for="rememberMe">Remember this node</label>
        </div>

        <button type="submit" class="auth-btn auth-btn-primary">SIGN IN</button>

        <div class="form-divider">or continue with</div>

        <div class="oauth-buttons">
          <button type="button" class="oauth-btn" onclick="handleOAuth('github')">🔘</button>
          <button type="button" class="oauth-btn" onclick="handleOAuth('google')">🔷</button>
          <button type="button" class="oauth-btn" onclick="handleOAuth('apple')">🍎</button>
        </div>

        <p class="auth-footer" style="margin-top: 1.5rem;">
          No account yet? <a href="javascript:switchTab('signup')">Create one</a>
        </p>
      </form>

      <!-- SIGN UP FORM -->
      <form class="auth-form" id="signupForm" onsubmit="handleSignUp(event)">
        <div class="form-group">
          <label class="form-label">Node Name</label>
          <input type="text" class="form-input" placeholder="Your mesh identity" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" placeholder="you@resilio.mesh" required>
        </div>

        <div class="form-group">
          <label class="form-label">Create Password</label>
          <input type="password" class="form-input" placeholder="Min 8 characters" required minlength="8">
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-input" placeholder="Repeat password" required>
        </div>

        <div class="form-checkbox">
          <input type="checkbox" id="agreeTerms" required>
          <label for="agreeTerms">
            I agree to <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="auth-btn auth-btn-primary">CREATE ACCOUNT</button>

        <div class="form-divider">or join with</div>

        <div class="oauth-buttons">
          <button type="button" class="oauth-btn" onclick="handleOAuth('github')">🔘</button>
          <button type="button" class="oauth-btn" onclick="handleOAuth('google')">🔷</button>
          <button type="button" class="oauth-btn" onclick="handleOAuth('apple')">🍎</button>
        </div>

        <p class="auth-footer" style="margin-top: 1.5rem;">
          Already have an account? <a href="javascript:switchTab('signin')">Sign in</a>
        </p>
      </form>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      const tabs = document.querySelectorAll('.auth-tab');
      const forms = document.querySelectorAll('.auth-form');
      
      tabs.forEach(t => t.classList.remove('active'));
      forms.forEach(f => f.classList.remove('active'));
      
      document.querySelector(`[onclick*="'${tab}'"]`).classList.add('active');
      document.getElementById(tab + 'Form').classList.add('active');
    }

    function handleSignIn(e) {
      e.preventDefault();
      const toast = document.createElement('div');
      toast.innerHTML = '✓ Sign in successful. Connecting to mesh...';
      toast.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--available);
        color: #000;
        padding: 1rem 1.5rem;
        border-radius: 6px;
        font-family: var(--font-mono);
        font-size: 0.9rem;
        z-index: 1000;
        animation: slideIn 0.3s ease;
      `;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
      
      // Redirect after delay
      setTimeout(() => window.location.href = 'index.html', 1500);
    }

    function handleSignUp(e) {
      e.preventDefault();
      const pass = e.target.querySelector('input[type="password"]');
      const confirm = e.target.querySelectorAll('input[type="password"]')[1];
      
      if (pass.value !== confirm.value) {
        const toast = document.createElement('div');
        toast.innerHTML = '✗ Passwords do not match';
        toast.style.cssText = `
          position: fixed;
          top: 20px;
          right: 20px;
          background: var(--urgent);
          color: #fff;
          padding: 1rem 1.5rem;
          border-radius: 6px;
          font-family: var(--font-mono);
          font-size: 0.9rem;
          z-index: 1000;
          animation: slideIn 0.3s ease;
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
        return;
      }

      const toast = document.createElement('div');
      toast.innerHTML = '✓ Account created. Joining mesh network...';
      toast.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--available);
        color: #000;
        padding: 1rem 1.5rem;
        border-radius: 6px;
        font-family: var(--font-mono);
        font-size: 0.9rem;
        z-index: 1000;
        animation: slideIn 0.3s ease;
      `;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
      
      // Redirect after delay
      setTimeout(() => window.location.href = 'index.html', 1500);
    }

    function handleOAuth(provider) {
      alert(`OAuth with ${provider} - Ready to integrate!`);
    }
  </script>
</body>
</html>
<!-- ==========================================
     END OF RAFI'S CODE (Authentication / Sign-In Page)
     ========================================== -->
